# wuwei 版打包配置：与 minicc 完全隔离（不同 appId / 数据目录 / 安装包名）。
# 用法: npx electron-builder --config electron-builder.wuwei.yml
appId: com.wuwei.app
productName: wuwei
directories:
  output: release
files:
  - out/**/*
  - build/icon.png
  - build/tray.ico
  - package.json
asarUnpack:
  - build/icon.png
  - build/tray.ico
  - "**/node_modules/@anthropic-ai/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@xenova/**"
mac:
  target:
    - target: dmg # 用户下载安装用
      arch: [x64, arm64]
    - target: zip # electron-updater 自动更新用（mac 只能从 zip 增量更新，不能从 dmg）
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
dmg:
  title: "wuwei ${version}"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  maintainer: wuwei
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "wuwei-${version}-setup.${ext}"
  # 覆盖「应用是否在运行」检测：electron-builder 默认实现的 PowerShell 分支漏了排除
  # 安装程序自身 PID，安装包一旦位于安装目录下就会自己撞自己、点重试也过不去。
  # 顺带把关不掉时的提示改成可操作的（托盘右键退出）。详见文件内注释。
  include: build/installer.nsh
npmRebuild: false
# 自动更新源：阿里云 OSS（generic provider）。无为专属 bucket = wuwei-repo。
#   发布时把 release/ 下的 wuwei-<ver>-setup.exe + latest.yml（+ mac/linux 对应文件）传到该 URL 路径。
# electron-updater 从这里读 latest.yml 比对版本、下载安装包。
publish:
  provider: generic
  url: https://wuwei-repo.oss-cn-hangzhou.aliyuncs.com/updates/
  channel: latest
