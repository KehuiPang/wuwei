# wuwei 版打包配置：与 minicc 完全隔离（不同 appId / 数据目录 / 安装包名）。
# 用法: npx electron-builder --config electron-builder.wuwei.yml
appId: com.wuwei.app
productName: wuwei
directories:
  output: release
files:
  - out/**/*
  - build/icon.png
  - build/tray.ico
  - package.json
asarUnpack:
  - build/icon.png
  - build/tray.ico
  - "**/node_modules/@anthropic-ai/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@xenova/**"
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
dmg:
  title: "wuwei ${version}"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  maintainer: wuwei
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "wuwei-${version}-setup.${ext}"
npmRebuild: false
# 自动更新源：阿里云 OSS（generic provider）。无为专属 bucket = wuwei-repo。
#   发布时把 release/ 下的 wuwei-<ver>-setup.exe + latest.yml（+ mac/linux 对应文件）传到该 URL 路径。
# electron-updater 从这里读 latest.yml 比对版本、下载安装包。
publish:
  provider: generic
  url: https://wuwei-repo.oss-cn-hangzhou.aliyuncs.com/updates/
  channel: latest
