<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" role="img" aria-label="Wuwei AI 终端演示">
  <defs>
    <style>
      .win{fill:#16191E}
      .bar{fill:#1E232B}
      .txt{fill:#E6E9EE;font-size:15px}
      .dim{fill:#8A93A0;font-size:15px}
      .spark{fill:#C05F3C;font-size:15px}
      .ok{fill:#4FAF6D;font-size:15px}
      .warn{fill:#D8A24A;font-size:15px}
      .cur{fill:#C05F3C}
      .l{opacity:0}
      @keyframes fadein{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      .l1{animation:fadein .01s .3s forwards}
      .l2{animation:fadein .01s 1.4s forwards}
      .l3{animation:fadein .01s 2.4s forwards}
      .l4{animation:fadein .01s 3.4s forwards}
      .l5{animation:fadein .01s 4.6s forwards}
      .l6{animation:fadein .01s 5.6s forwards}
      .l7{animation:fadein .01s 6.6s forwards}
      .cursor{animation:blink 1s steps(1) infinite}
      /* 循环重置：8.6s 后全部隐藏再来 */
      .loop{animation:fadeloop 8.6s linear infinite}
    </style>
  </defs>

  <!-- 窗口 -->
  <rect class="win" x="0" y="0" width="860" height="480" rx="12"/>
  <rect class="bar" x="0" y="0" width="860" height="38" rx="12"/>
  <rect class="bar" x="0" y="26" width="860" height="12"/>
  <circle cx="22" cy="19" r="6" fill="#E5533B"/>
  <circle cx="44" cy="19" r="6" fill="#E0A83E"/>
  <circle cx="66" cy="19" r="6" fill="#4FAF6D"/>
  <text x="430" y="24" text-anchor="middle" class="dim" font-size="13">无为 · Wuwei AI</text>

  <!-- 会话内容 -->
  <g transform="translate(26,74)">
    <text class="txt l l1" y="0"><tspan class="spark">›</tspan> <tspan class="txt">把 utils.py 里的 add 函数加上类型注解</tspan></text>

    <text class="dim l l2" y="34">● 读取 utils.py …</text>

    <text class="l l3" y="68"><tspan class="dim">● 编辑 utils.py</tspan> <tspan class="dim">(write)</tspan> — <tspan class="warn">允许? [y/N/a]</tspan> <tspan class="txt">y</tspan></text>

    <text class="ok l l4" y="102">  ✓ 已更新 utils.py</text>

    <text class="txt l l5" y="146"><tspan class="dim">def</tspan> add(a: <tspan class="spark">int</tspan>, b: <tspan class="spark">int</tspan>) -&gt; <tspan class="spark">int</tspan>:</text>
    <text class="dim l l6" y="170">    return a + b</text>

    <text class="txt l l7" y="214"><tspan class="ok">完成</tspan> · 给 add() 加上了 int 类型注解，每步都经你确认。</text>

    <!-- 输入行 + 闪烁光标 -->
    <text class="txt" y="260"><tspan class="spark">›</tspan> <tspan class="cur cursor">▋</tspan></text>
  </g>

  <text x="834" y="466" text-anchor="end" class="dim" font-size="12">wuweiai.io</text>
</svg>
