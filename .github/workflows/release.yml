# push 一个 v* tag（如 git tag v1.1.0 && git push origin v1.1.0）即自动：
# 在 Linux runner 打 AppImage/deb、macOS runner 打 dmg(Intel+Apple Silicon)、
# Windows runner 打 exe，并发到 Release（三平台）。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build renderer/main
        run: npm run desktop:build

      # 用 electron-builder.wuwei.yml：含 generic OSS publish 配置 → 会生成 latest*.yml 更新清单
      # （--publish never 只是不让 electron-builder 自己上传；清单仍写入 release/，由下方 OSS 步骤上传）
      - name: Package Linux (AppImage/deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --config electron-builder.wuwei.yml --publish never

      - name: Package macOS (dmg + zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --config electron-builder.wuwei.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 无签名证书：跳过签名，产出未签名 dmg

      # Windows 代码签名：Azure Trusted Signing（electron-builder 26 原生支持，打包时自动 Install-Module TrustedSigning）。
      # 开关 = 是否配置了 AZURE_TS_ENDPOINT secret：
      #   · 未配置(默认) → 走原始未签名命令，行为与接入前完全一致，绝不破坏现有发版。
      #   · 已配置       → 用 -c.win.azureSignOptions.* 注入签名参数（值全部来自 secrets，不落库），
      #                    产出「发布者=公司名」的已签名 exe，用户不再见 SmartScreen「发布者未知」警告。
      # 需在仓库 Secrets 配齐 7 项：AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
      #   / AZURE_TS_ENDPOINT / AZURE_TS_ACCOUNT / AZURE_TS_PROFILE / AZURE_PUBLISHER_NAME
      - name: Package Windows (exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $common = @('--win', '--config', 'electron-builder.wuwei.yml', '--publish', 'never')
          if ($env:AZURE_TS_ENDPOINT) {
            Write-Host 'Azure Trusted Signing 已配置 → 打签名包'
            npx electron-builder @common `
              "-c.win.azureSignOptions.endpoint=$env:AZURE_TS_ENDPOINT" `
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_TS_ACCOUNT" `
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_TS_PROFILE" `
              "-c.win.azureSignOptions.publisherName=$env:AZURE_PUBLISHER_NAME"
          } else {
            Write-Host '未配置 Azure Trusted Signing → 打未签名包（行为同接入前）'
            npx electron-builder @common
          }
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}

      # 上传安装包 + latest*.yml 到阿里云 OSS（自动更新源 + 官网下载源）。
      # 凭证走仓库 secrets；未配置则脚本内跳过，不影响 GitHub Release。
      - name: Upload to Aliyun OSS
        run: |
          npm i ali-oss@6 --no-save --no-audit --no-fund
          node scripts/upload-oss.mjs
        env:
          OSS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
